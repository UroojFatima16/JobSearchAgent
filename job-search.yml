name: Daily Job Search Agent

on:
  schedule:
    # Runs every day at 08:00 PKT (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from GitHub UI

permissions:
  contents: write  # needed to commit updated seen_jobs.json back to the repo

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Commit updated seen_jobs.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Job Search Agent Bot"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
